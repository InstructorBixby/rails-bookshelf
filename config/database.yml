default: &default
  adapter: sqlite3
  pool: 5
  timeout: 5000

development:
  <<: *default
  database: db/development.sqlite3

test:
  <<: *default
  database: db/test.sqlite3

# heroku overwrites this with DATABASE_URL anyway but rails still wants
# the key to exist
production:
  adapter: postgresql
  encoding: unicode
  pool: 5
